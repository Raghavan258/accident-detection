name: mlops

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest
      - name: Training data is local
        run: |
          if [ ! -f datasets/processed/features.parquet ]; then
            echo "Processed features are not in git. Export them locally before dvc repro."
          fi
